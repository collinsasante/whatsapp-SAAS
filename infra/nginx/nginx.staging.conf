user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 512M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Staging server — HTTP only on port 80 (mapped to 8080 on host)
    server {
        listen 80;
        server_name _;

        # API endpoints
        location /api/ {
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Socket.IO realtime
        location /socket.io/ {
            set $realtime http://realtime:3002;
            proxy_pass $realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # Storage / MinIO proxy
        location /storage/ {
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"staging-ok"}';
            add_header Content-Type application/json;
        }

        # Frontend (everything else)
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Next.js static files
        location /_next/static/ {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
        }
    }

    # Staging server — HTTPS on port 443 in-container (mapped to 8443 on the
    # host; the standard 443 is already bound to production's nginx on this
    # VPS). Needed for Meta OAuth/webhook config, which requires HTTPS.
    # Cert obtained separately via certbot for staging.verzchat.com specifically
    # (see infra/scripts, DEPLOYMENT.md) -- not the same cert as verzchat.com.
    server {
        listen 443 ssl;
        server_name staging.verzchat.com;

        ssl_certificate         /etc/letsencrypt/live/staging.verzchat.com/fullchain.pem;
        ssl_certificate_key     /etc/letsencrypt/live/staging.verzchat.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/staging.verzchat.com/chain.pem;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # API endpoints
        location /api/ {
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Socket.IO realtime
        location /socket.io/ {
            set $realtime http://realtime:3002;
            proxy_pass $realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # Storage / MinIO proxy
        location /storage/ {
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"staging-ok"}';
            add_header Content-Type application/json;
        }

        # Frontend (everything else)
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Next.js static files
        location /_next/static/ {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
        }
    }
}
