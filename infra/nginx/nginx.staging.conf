user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 512M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server_tokens off;

    # ── Real client address ────────────────────────────────────────────────────────────────────────────────────────────────────
    # Staging is reached through Cloudflare, so the TCP peer is a Cloudflare edge address. Cloudflare puts the visitor's address
    # in CF-Connecting-IP (one value, overwritten on every request). nginx honours that header ONLY when the TCP peer is inside
    # the explicit Cloudflare ranges below (IPv4 and IPv6); from any other peer, including a direct connection to the origin, the
    # header is ignored and the peer's own address is used. So a visitor cannot choose their own rate-limit key or their logged
    # address by sending CF-Connecting-IP, X-Forwarded-For or X-Real-IP. Keep this list in step with
    # https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6 (infra/scripts/tests/nginx-staging.test.sh checks it).
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # ── Rate limits, keyed on the real client address; same rates as production ────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=100r/m;
    # 429 says what happened (503 looks like an outage); warn level puts "limiting requests" in the error log.
    limit_req_status 429;
    limit_req_log_level warn;

    # Staging server — HTTP only on port 80 (mapped to 8080 on host)
    server {
        listen 80;
        server_name _;

        # API endpoints (rate limited per real client address; webhook and auth have their own, as in production)
        location /api/v1/webhook/ {
            limit_req zone=webhook burst=50 nodelay;
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The client address as nginx established it (see the real-address block above). The backend trusts exactly one proxy hop and
            # reads the LAST X-Forwarded-For entry, so this header is replaced, never appended to: a client-supplied prefix cannot reach it.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The client address as nginx established it (see the real-address block above). The backend trusts exactly one proxy hop and
            # reads the LAST X-Forwarded-For entry, so this header is replaced, never appended to: a client-supplied prefix cannot reach it.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The client address as nginx established it (see the real-address block above). The backend trusts exactly one proxy hop and
            # reads the LAST X-Forwarded-For entry, so this header is replaced, never appended to: a client-supplied prefix cannot reach it.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Socket.IO realtime
        location /socket.io/ {
            set $realtime http://realtime:3002;
            proxy_pass $realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # Storage / MinIO proxy
        location /storage/ {
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"staging-ok"}';
            add_header Content-Type application/json;
        }

        # Frontend (everything else)
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Next.js static files
        location /_next/static/ {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
        }
    }

    # Staging server — HTTPS on port 443 in-container (mapped to 8443 on the
    # host; the standard 443 is already bound to production's nginx on this
    # VPS). Needed for Meta OAuth/webhook config, which requires HTTPS.
    # Cert obtained separately via certbot for staging.verzchat.com specifically
    # (see infra/scripts, DEPLOYMENT.md) -- not the same cert as verzchat.com.
    server {
        listen 443 ssl;
        server_name staging.verzchat.com;

        ssl_certificate         /etc/letsencrypt/live/staging.verzchat.com/fullchain.pem;
        ssl_certificate_key     /etc/letsencrypt/live/staging.verzchat.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/staging.verzchat.com/chain.pem;

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # API endpoints (rate limited per real client address; webhook and auth have their own, as in production)
        location /api/v1/webhook/ {
            limit_req zone=webhook burst=50 nodelay;
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The client address as nginx established it (see the real-address block above). The backend trusts exactly one proxy hop and
            # reads the LAST X-Forwarded-For entry, so this header is replaced, never appended to: a client-supplied prefix cannot reach it.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The client address as nginx established it (see the real-address block above). The backend trusts exactly one proxy hop and
            # reads the LAST X-Forwarded-For entry, so this header is replaced, never appended to: a client-supplied prefix cannot reach it.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The client address as nginx established it (see the real-address block above). The backend trusts exactly one proxy hop and
            # reads the LAST X-Forwarded-For entry, so this header is replaced, never appended to: a client-supplied prefix cannot reach it.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Socket.IO realtime
        location /socket.io/ {
            set $realtime http://realtime:3002;
            proxy_pass $realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_buffering off;
            proxy_cache off;
        }

        # Storage / MinIO proxy
        location /storage/ {
            set $backend http://backend:3001;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"staging-ok"}';
            add_header Content-Type application/json;
        }

        # Frontend (everything else)
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Next.js static files
        location /_next/static/ {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
        }
    }
}
