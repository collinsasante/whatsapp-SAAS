# Standalone staging compose — run with a single -f flag (no merge with production).
# Staging reads infra/.env.staging, never the production infra/.env (they would share every secret). To recreate
# containers use infra/scripts/staging-recreate.sh, which refuses to run if a secret matches production's.
# Application releases must use infra/scripts/staging-release-deploy.sh. It builds immutable revision-tagged images,
# verifies a disposable restore of the snapshot, applies Prisma migrations explicitly, then rolls out all app services.
# Direct `up --build` remains for local bootstrap only; it is not a release or migration procedure.
# Access: http://VPS_IP:8080, or https://staging.verzchat.com:8443 once
# STAGING_PUBLIC_URL is set in .env.staging (needed for Meta OAuth/webhook
# config, which requires HTTPS) -- see infra/nginx/nginx.staging.conf.
#
# The `-p staging` flag this comment used to require is no longer necessary
# -- the `name:` field below declares the project name explicitly, so it
# applies regardless of how the command is invoked. This matters because
# docker-compose.yml (production) lives in this same "infra" directory;
# without an explicit name, Compose derives one from the directory itself,
# which both files would then share -- letting a command run against one
# file recreate/touch the other stack's containers. This happened for real.
name: verzchat-staging

networks:
  staging-network:
    driver: bridge

volumes:
  # Pinned to the real, already-populated volume by its exact existing name.
  # Before this, Compose derived an implicit name for this volume by
  # prefixing it with the project name -- fine as long as the project name
  # never changes, but the project-isolation fix above (explicit `name:`)
  # changed it from the old implicit "infra" to "verzchat-staging", which
  # made Compose create a brand-new EMPTY volume under that new prefix
  # instead of reusing the real one. This caused a real, live "table users
  # does not exist" outage. `external: true` tells Compose to never
  # create/manage this volume's lifecycle -- just mount exactly the named
  # volume that already has the real data, regardless of what the project
  # name is now or ever becomes in the future.
  postgres_staging_data:
    external: true
    name: staging_postgres_staging_data
  # Same issue, same fix -- confirmed live: the project-name change had
  # already silently switched this to a new, nearly-empty volume by the
  # time this was caught (232K of new uploads existed there, merged into
  # the real one below before this pin was added).
  redis_staging_data:
    external: true
    name: staging_redis_staging_data
  minio_staging_data:
    external: true
    name: staging_minio_staging_data
  uploads_staging_data:
    external: true
    name: staging_uploads_staging_data

services:
  postgres:
    # Staging's database runs PostgreSQL WITH the pgvector extension (hybrid RAG): same server version and the same data volume as
    # postgres:16-alpine, with the extension compiled in and only enabled per database by an explicit CREATE EXTENSION. The image tag is
    # pinned to the minor version staging runs. NEVER change this to a stock postgres image: a stock image cannot load the extension that
    # is already registered in the staging database, which breaks hybrid retrieval and pg_dump/pg_restore of the vector table.
    # A release never builds or recreates this service (staging-release-deploy.sh builds the five application services only and starts
    # them with --no-deps); changing the database image is the explicit, backed-up procedure in docs/staging-release.md.
    image: verzchat-staging/postgres-pgvector:16.15-0.8.7
    build:
      context: ./postgres
      args:
        PG_IMAGE: postgres:16.15-alpine
        PGVECTOR_VERSION: v0.8.7
    container_name: wa_staging_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-waplatform}_staging
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wa_staging_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_staging_data:/data
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: wa_staging_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_staging_data:/data
    # No host ports: only the backend uses MinIO, over staging-network (minio:9000). Publishing them put the API and
    # console on every host interface, and Docker-published ports bypass UFW.
    networks:
      - staging-network

  backend:
    image: verzchat-staging/backend:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: wa_staging_backend
    # Migrations are an explicit, backed-up release step, not an application startup side effect.
    command: ["node", "dist/main"]
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      # NODE_ENV is "production" here too (build/runtime optimization, not
      # which deployment this is) -- ENABLE_DEV_TOOLS is the actual signal
      # that unlocks the internal AI/Commerce Testing Center, Test Chat, and
      # Evaluation Runs endpoints. Staging only -- deliberately absent from
      # infra/docker-compose.yml so it defaults to blocked in production.
      ENABLE_DEV_TOOLS: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-waplatform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-waplatform}_staging
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: ${STAGING_PUBLIC_URL:-http://${VPS_IP}:8080}
      API_URL: ${STAGING_PUBLIC_URL:-http://${VPS_IP}:8080}/api/v1
      REALTIME_URL: http://realtime:3002
      PUBLIC_URL: ${STAGING_PUBLIC_URL:-http://${VPS_IP}:8080}
      WHATSAPP_WEB_INTERNAL_URL: http://whatsapp-web:3004
      WHATSAPP_WEB_INTERNAL_API_KEY: ${WHATSAPP_WEB_INTERNAL_API_KEY:-}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_LOGIN_CONFIG_ID: ${FACEBOOK_LOGIN_CONFIG_ID:-}
      INSTAGRAM_LOGIN_CONFIG_ID: ${INSTAGRAM_LOGIN_CONFIG_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_REQUEST_PUBLISH_SCOPE: ${TIKTOK_REQUEST_PUBLISH_SCOPE:-}
      TIKTOK_PUBLISH_ALLOWED_PRIVACY: ${TIKTOK_PUBLISH_ALLOWED_PRIVACY:-}
      TIKTOK_PUBLISH_RUNNER: ${TIKTOK_PUBLISH_RUNNER:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      MESSENGER_WEBHOOK_VERIFY_TOKEN: ${MESSENGER_WEBHOOK_VERIFY_TOKEN:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-whatsapp-platform}-staging
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
      PLATFORM_ADMIN_SETUP_SECRET: ${PLATFORM_ADMIN_SETUP_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # AI Learning (privacy-gated; see docs/DIGITAL_SELF_LEARNING_PRIVACY.md). Every default is the safe one: opt-in closed, retention off,
      # budgets and periods empty = the code defaults. Backend only: the worker has no learning code.
      AI_LEARNING_OPT_IN_OPEN: ${AI_LEARNING_OPT_IN_OPEN:-false}
      AI_LEARNING_WORKSPACE_MONTHLY_BUDGET_USD: ${AI_LEARNING_WORKSPACE_MONTHLY_BUDGET_USD:-}
      AI_LEARNING_GLOBAL_MONTHLY_BUDGET_USD: ${AI_LEARNING_GLOBAL_MONTHLY_BUDGET_USD:-}
      AI_LEARNING_MAX_RESERVATION_USD: ${AI_LEARNING_MAX_RESERVATION_USD:-}
      AI_LEARNING_RETENTION_ENABLED: ${AI_LEARNING_RETENTION_ENABLED:-false}
      AI_LEARNING_RETENTION_FREE_TEXT_DAYS: ${AI_LEARNING_RETENTION_FREE_TEXT_DAYS:-}
      AI_LEARNING_RETENTION_METRICS_MONTHS: ${AI_LEARNING_RETENTION_METRICS_MONTHS:-}
      # Hybrid RAG. OFF unless RAG_HYBRID_ENABLED is exactly "true" in .env.staging. The embedding model and the ONNX runtime are READ-ONLY host
      # mounts (see volumes), not part of the image; the two paths below are the in-container locations of those mounts.
      NODE_PATH: /ort/node_modules
      EMBEDDING_MODEL_DIR: /models/all-MiniLM-L6-v2
      RAG_HYBRID_ENABLED: ${RAG_HYBRID_ENABLED:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SUPPORT_FORWARD_EMAIL: ${SUPPORT_FORWARD_EMAIL:-support@verzchat.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      BILLING_NOTIFY_EMAIL: ${BILLING_NOTIFY_EMAIL:-}
      GHS_RATE: ${GHS_RATE:-12.5}
      SUPPORT_TENANT_ID: ${SUPPORT_TENANT_ID:-}
    volumes:
      - uploads_staging_data:/app/uploads
      # Hybrid RAG assets: read-only, and the host directories must already exist (create_host_path: false makes a missing directory a
      # start-up error instead of Docker silently creating an empty, root-owned one). The deploy script verifies them (and the pinned
      # SHA-256 of the model files) before it touches anything.
      - type: bind
        source: /opt/verz-models/all-MiniLM-L6-v2
        target: /models/all-MiniLM-L6-v2
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/verz-ort
        target: /ort
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staging-network

  realtime:
    image: verzchat-staging/realtime:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/realtime/Dockerfile
    container_name: wa_staging_realtime
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${STAGING_PUBLIC_URL:-http://${VPS_IP}:8080}
      BACKEND_URL: http://backend:3001
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - staging-network

  worker:
    image: verzchat-staging/worker:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: wa_staging_worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-waplatform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-waplatform}_staging
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      WHATSAPP_WEB_INTERNAL_URL: http://whatsapp-web:3004
      WHATSAPP_WEB_INTERNAL_API_KEY: ${WHATSAPP_WEB_INTERNAL_API_KEY:-}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      # Same key as the backend: the worker opens the stored WhatsApp credentials to send campaigns. Without it every send fails.
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      # TikTok token refresh (worker job tiktok-token-refresh) calls TikTok's token endpoint with the app credentials
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      # Internal calls to the backend must include the global API prefix.
      BACKEND_URL: http://backend:3001/api/v1
      # Campaign click-tracking links; without it the worker would use the production address.
      PUBLIC_BASE_URL: ${STAGING_PUBLIC_URL:-http://${VPS_IP}:8080}/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staging-network

  # Unofficial WhatsApp Web / linked-device (QR) channel -- see the
  # equivalent block in docker-compose.yml for the full rationale. Never
  # exposed through nginx.
  whatsapp-web:
    image: verzchat-staging/whatsapp-web:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/whatsapp-web/Dockerfile
    container_name: wa_staging_whatsapp_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-waplatform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-waplatform}_staging
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      BACKEND_INTERNAL_URL: http://backend:3001
      WHATSAPP_WEB_INTERNAL_API_KEY: ${WHATSAPP_WEB_INTERNAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging-network

  frontend:
    image: verzchat-staging/frontend:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${STAGING_PUBLIC_URL:-http://${VPS_IP}:8080}/api/v1
        NEXT_PUBLIC_SOCKET_URL: ${STAGING_PUBLIC_URL:-http://${VPS_IP}:8080}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        # Staging only -- shows Testing Center/Test Chat/Evaluation Runs in
        # nav. Deliberately absent from infra/docker-compose.yml so it's
        # unset (falsy) in the production build.
        NEXT_PUBLIC_SHOW_DEV_TOOLS: "true"
    container_name: wa_staging_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - staging-network

  nginx:
    image: nginx:1.27-alpine
    container_name: wa_staging_nginx
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      # Same host cert store production's nginx already reads from -- lets
      # this container serve the staging.verzchat.com cert once issued via
      # certbot on the host, without a separate cert-mount scheme.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
      - realtime
    networks:
      - staging-network
